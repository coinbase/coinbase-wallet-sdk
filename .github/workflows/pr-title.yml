name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Validate Conventional Commit format
    runs-on: [default-config, medium, amd64]
    steps:
      # Inline check: GHE rejects amannn/action-semantic-pull-request at startup.
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if echo "$TITLE" | grep -Eq '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\(.+\))?!?: .+'; then
            echo "PR title is valid: $TITLE"
            exit 0
          fi
          echo "::error::PR title must follow Conventional Commits (e.g. ci: use GHE runners)"
          exit 1
