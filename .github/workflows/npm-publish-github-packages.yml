    aws_site_cdn_min_ttl: # optional
    # Default TTL (in seconds) for CloudFront cache. Default is 86400 (24 hours).
    aws_site_cdn_default_ttl: # optional
    # Maximum TTL (in seconds) for CloudFront cache. Default is 31536000 (365 days).
    aws_site_cdn_max_ttl: # optional
