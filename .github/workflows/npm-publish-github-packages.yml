  # You may pin to the exact commit or the version.
  # uses: bitovi/github-actions-deploy-static-site-to-aws@d51f8d905f34a40b8abc6567db6ffab15a205fec
  uses: bitovi/github-actions-deploy-static-site-to-aws@v0.2.10
  with:
    # Specifies if this action should checkout the code
    checkout: # optional, default is true
    # AWS access key ID
    aws_access_key_id: 
    # AWS secret access key
    aws_secret_access_key: 
    # AWS default region
    aws_default_region: # optional, default is us-east-1
    # AWS Role to assume.
    aws_role_to_assume: # optional
    # Set to override the AWS resource identifier for the deployment.  Defaults to `${org}-{repo}-{branch}`.  Use with destroy to destroy specific resources.
    aws_resource_identifier: # optional
    # A JSON object of additional tags that will be included on created resources. Example: `{"key1": "value1", "key2": "value2"}`
    aws_additional_tags: # optional
    # Option to run Terraform apply / destroy option. Will run plan if nothing defined.
    tf_action: # optional
    # Change this to be anything you want to. Carefull to be consistent here. A missing file could trigger recreation, or stepping over destruction of non-defined objects.
    tf_state_file_name: # optional
    # Append a string to the tf-state-file. Setting this to `unique` will generate `tf-state-aws-unique`. Can co-exist with the tf_state_file_name variable. 
    tf_state_file_name_append: # optional
    # AWS S3 bucket to use for Terraform state. Defaults to `${org}-${repo}-{branch}-tf-state`
    tf_state_bucket: # optional
    # Force purge and deletion of S3 bucket defined if terraform destroy action succeded.
    tf_state_bucket_destroy: # optional
    # Source folder for files to be published. Will ignore any hidden file. Defaults to root folder of the calling repo if nothing defined.
    aws_site_source_folder: 
    # Include hidden files in the source folder. Defaults to `false`
    aws_site_source_include_hidden: # optional
    # Root object to be served as entry-point. Defaults to `index.html`
    aws_site_root_object: # optional
    # Error document set to S3 website config. Defaults to none.
    aws_site_error_document: # optional
    #  AWS S3 bucket name to use for the public files. Defaults to `${org}-${repo}-{branch}-sp`
    aws_site_bucket_name: # optional
    # Enable or disables the use of CDN. Defaults to `false`.
    aws_site_cdn_enabled: # optional
    # Extra CNAMEs (alternate domain names), if any, for this distribution. Will default to defined domain if none passed.
    aws_site_cdn_aliases: # optional
    # Customize error codes, Definition done with JSON variables
    aws_site_cdn_custom_error_codes: # optional
